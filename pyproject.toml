[project]
name = "omura"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "duckdb",
    "fastapi>=0.128.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "setuptools>=70.2.0",
    "torch>=2.9.1",
    "torchvision",
    "torchaudio",
    "walrus-python>=0.1.0",
    "uvicorn>=0.40.0",
    "httpx>=0.28.1",
    "python-magic>=0.4.27",
    "transformers>=5.5.0",
    "qwen-omni-utils>=0.0.4",
    "qwen-vl-utils>=0.0.4",
    "soundfile>=0.12.1",
    "accelerate>=1.12.0",
    "sentencepiece>=0.2.1",
    "protobuf>=6.33.2",
    "faiss-cpu>=1.13.2",
    "pypdf>=6.5.0",
    "decord>=0.6.0",
    "wheel",
    "packaging",
    "python-multipart>=0.0.24",
    "timm>=1.0.26",
    "einops>=0.8.2",
    "dotenv>=0.9.9",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu130"

[[tool.uv.index]]
url = "https://pypi.nvidia.com/"

[tool.uv.extra-build-dependencies]
flash-attn = ["wheel", "packaging"]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]
[tool.uv]
# Limit resolution to Linux x86_64 to avoid aarch64 wheel branches
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
